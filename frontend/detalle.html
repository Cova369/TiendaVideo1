<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👁️ Detalle del Videojuego</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #121214;
            color: #fff;
            margin: 40px;
        }

        .nav-principal {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #202024;
            padding: 15px 30px;
            margin: -40px -40px 30px -40px;
            border-bottom: 1px solid #29292e;
        }

        .nav-link {
            color: #a8a8b3;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-link:hover,
        .nav-link.activo {
            color: #fff;
        }

        .nav-usuario {
            margin-left: auto;
            color: #04d361;
            font-size: 14px;
        }

        .contenido-centrado {
            display: flex;
            justify-content: center;
        }
        
        .detalle-card {
            background: #202024;
            padding: 30px;
            border-radius: 8px;
            width: 600px;
            border: 1px solid #29292e;
            display: flex;
            gap: 25px;
        }
        
        .col-izq {
            width: 40%;
        }
        
        .col-der {
            width: 60%;
            display: flex;
            flex-direction: column;
        }
        
        img {
            width: 100%;
            border-radius: 6px;
            object-fit: cover;
        }
        
        .precio {
            font-size: 24px;
            color: #04d361;
            font-weight: bold;
            margin: 15px 0 5px 0;
        }
        
        .meta {
            color: #a8a8b3;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .acciones {
            margin-top: auto;
            display: flex;
            gap: 10px;
        }
        
        button {
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }
        
        .btn-editar {
            background: #e1e1e6;
            color: #121214;
        }
        
        .btn-eliminar {
            background: #f75a68;
            color: #fff;
        }
        
        .btn-volver {
            background: #29292e;
            color: #fff;
            text-align: center;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            display: block;
        }

        .seccion-resenas {
            max-width: 600px;
            margin: 30px auto 0 auto;
        }

        .seccion-resenas h3 {
            color: #8257e5;
        }

        .tarjeta-resena {
            background: #202024;
            border: 1px solid #29292e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .tarjeta-resena .encabezado-resena {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .tarjeta-resena .autor {
            font-weight: bold;
        }

        .tarjeta-resena .estrellas {
            color: #f7b734;
        }

        .form-resena {
            background: #202024;
            border: 1px solid #29292e;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
        }

        .form-resena select,
        .form-resena textarea {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: #121214;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .form-resena button {
            background: #04d361;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .aviso-permiso-resena {
            color: #a8a8b3;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="contenido-centrado">
        <div id="contenedorDetalle">Cargando detalles del juego...</div>
    </div>

    <div class="seccion-resenas" id="seccionResenas">
        <h3>💬 Reseñas</h3>
        <div id="listaResenas"><p>Cargando reseñas...</p></div>
        <div id="panelResena"></div>
    </div>

    <script src="js/sesion.js"></script>
    <script>
        const API_URL = "https://tienda-video1.vercel.app/api/videojuegos";

        // Función nativa de JS para extraer parámetros de la barra de direcciones (?id=...)
        const urlParams = new URLSearchParams(window.location.search);
        const juegoId = urlParams.get("id");

        async function cargarDetalle() {
            try {
                const respuesta = await fetch(`${API_URL}/${juegoId}`);
                const juego = await respuesta.json();

                document.getElementById("contenedorDetalle").innerHTML = `
          <div class="detalle-card">
            <div class="col-izq">
              <img src="${juego.imagenUrl}" alt="${juego.titulo}">
              <a href="index.html" class="btn-volver">⬅️ Volver</a>
            </div>
            <div class="col-der">
              <h2>${juego.titulo}</h2>
              <p class="meta"><strong>Desarrollador:</strong> ${juego.desarrollador}</p>
              <p class="meta"><strong>Plataformas:</strong> ${juego.plataformas.join(', ')}</p>
              <p class="meta"><strong>Disponibles:</strong> ${juego.stock} unidades</p>
              <p>${juego.descripcion}</p>
              <div class="precio">$${juego.precio}</div>
              <div class="acciones">
                <button class="btn-editar" onclick="window.location.href='editar.html?id=${juego._id}'">✏️ Editar</button>
                <button class="btn-eliminar" onclick="eliminarJuego()">🗑️ Eliminar</button>
              </div>
            </div>
          </div>
        `;
            } catch (error) {
                document.getElementById("contenedorDetalle").innerHTML = "<p>Error al cargar el documento.</p>";
            }
        }

        async function eliminarJuego() {
            if (!confirm("⚠️ ¿Estás completamente seguro de borrar este videojuego del inventario NoSQL?")) return;

            try {
                const respuesta = await fetch(`${API_URL}/${juegoId}`, {
                    method: "DELETE",
                    headers: headerAutorizacion()
                });
                if (respuesta.ok) {
                    alert("🗑️ Videojuego borrado correctamente.");
                    window.location.href = "index.html";
                } else {
                    const datosError = await respuesta.json().catch(() => ({}));
                    alert("❌ " + (datosError.mensaje || "Error al intentar eliminar."));
                }
            } catch (error) {
                alert("Error al intentar eliminar.");
            }
        }

        // ============================================================
        // RESEÑAS
        // ============================================================

        // Guarda la reseña del usuario actual (si ya tiene una para este
        // juego) para saber si el formulario debe crear o actualizar.
        let miResenaExistente = null;

        async function cargarResenas() {
            const contenedor = document.getElementById("listaResenas");
            const sesion = obtenerSesion();

            try {
                const respuesta = await fetch(`${API_BASE}/resenas?videojuegoId=${juegoId}`);
                const resenas = await respuesta.json();

                miResenaExistente = null;
                if (sesion) {
                    miResenaExistente = resenas.find(r => String(r.usuario.id) === String(sesion.usuario.id)) || null;
                }

                if (resenas.length === 0) {
                    contenedor.innerHTML = "<p>Todavía no hay reseñas para este juego. ¡Sé el primero!</p>";
                    return;
                }

                contenedor.innerHTML = resenas.map(resena => `
          <div class="tarjeta-resena">
            <div class="encabezado-resena">
              <span class="autor">${resena.usuario.nombre || 'Cliente'}</span>
              <span class="estrellas">${'⭐'.repeat(resena.calificacion)}</span>
            </div>
            <p>${resena.comentario}</p>
          </div>
        `).join("");
            } catch (error) {
                contenedor.innerHTML = `<p style="color:#f75a68;">❌ Error al cargar reseñas: ${error.message}</p>`;
            }
        }

        function renderPanelResena() {
            const sesion = obtenerSesion();
            const panel = document.getElementById("panelResena");

            if (!sesion) {
                panel.innerHTML = `<p class="aviso-permiso-resena">Inicia sesión como cliente para dejar tu reseña. <a href="login.html" style="color:#8257e5;">Iniciar sesión</a></p>`;
                return;
            }

            if (sesion.usuario.rol !== "cliente") {
                panel.innerHTML = `<p class="aviso-permiso-resena">Solo los clientes pueden publicar reseñas.</p>`;
                return;
            }

            const calificacionActual = miResenaExistente ? miResenaExistente.calificacion : 5;
            const comentarioActual = miResenaExistente ? miResenaExistente.comentario : "";
            const textoBoton = miResenaExistente ? "Actualizar mi reseña" : "Publicar reseña";

            panel.innerHTML = `
        <div class="form-resena">
          <h4>${miResenaExistente ? '✏️ Edita tu reseña' : '➕ Deja tu reseña'}</h4>
          <select id="calificacion">
            <option value="5" ${calificacionActual == 5 ? 'selected' : ''}>⭐⭐⭐⭐⭐ (5)</option>
            <option value="4" ${calificacionActual == 4 ? 'selected' : ''}>⭐⭐⭐⭐ (4)</option>
            <option value="3" ${calificacionActual == 3 ? 'selected' : ''}>⭐⭐⭐ (3)</option>
            <option value="2" ${calificacionActual == 2 ? 'selected' : ''}>⭐⭐ (2)</option>
            <option value="1" ${calificacionActual == 1 ? 'selected' : ''}>⭐ (1)</option>
          </select>
          <textarea id="comentario" rows="3" placeholder="¿Qué te pareció el juego?">${comentarioActual}</textarea>
          <button onclick="guardarResena()">${textoBoton}</button>
          <div id="mensajeErrorResena" style="color:#f75a68; font-size:14px; margin-top:8px;"></div>
        </div>
      `;
        }

        async function guardarResena() {
            const mensajeError = document.getElementById("mensajeErrorResena");
            mensajeError.textContent = "";

            const datosResena = {
                videojuegoId: juegoId,
                calificacion: parseInt(document.getElementById("calificacion").value),
                comentario: document.getElementById("comentario").value
            };

            try {
                // Si ya existía una reseña de este usuario para este juego,
                // la actualizamos (PUT); si no, creamos una nueva (POST).
                const url = miResenaExistente ? `${API_BASE}/resenas/${miResenaExistente._id}` : `${API_BASE}/resenas`;
                const metodo = miResenaExistente ? "PUT" : "POST";

                const respuesta = await fetch(url, {
                    method: metodo,
                    headers: Object.assign({ "Content-Type": "application/json" }, headerAutorizacion()),
                    body: JSON.stringify(datosResena)
                });
                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    mensajeError.textContent = "❌ " + (datos.mensaje || "No se pudo guardar la reseña");
                    return;
                }

                await cargarResenas();
                renderPanelResena();
            } catch (error) {
                mensajeError.textContent = "❌ Error de red: " + error.message;
            }
        }

        window.onload = async() => {
            renderNav("detalle.html");
            await cargarDetalle();
            await cargarResenas();
            renderPanelResena();
        };
    </script>
</body>

</html>
