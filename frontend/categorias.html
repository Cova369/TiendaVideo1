<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏷️ Categorías</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #121214;
            color: #fff;
            margin: 40px;
        }

        h1 {
            color: #8257e5;
        }

        .nav-principal {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #202024;
            padding: 15px 30px;
            margin: -40px -40px 30px -40px;
            border-bottom: 1px solid #29292e;
        }

        .nav-link {
            color: #a8a8b3;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-link:hover,
        .nav-link.activo {
            color: #fff;
        }

        .nav-usuario {
            margin-left: auto;
            color: #04d361;
            font-size: 14px;
        }

        .layout {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .lista-categorias {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tarjeta-categoria {
            background: #202024;
            border: 1px solid #29292e;
            border-radius: 8px;
            padding: 15px 20px;
        }

        .tarjeta-categoria h3 {
            margin: 0 0 5px 0;
            color: #fff;
        }

        .tarjeta-categoria p {
            margin: 0;
            color: #a8a8b3;
            font-size: 14px;
        }

        .acciones-categoria {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .acciones-categoria button {
            width: auto;
            padding: 8px 14px;
            font-size: 13px;
        }

        .btn-eliminar {
            background: #f75a68 !important;
        }

        .btn-eliminar:hover {
            background: #d94552 !important;
        }

        .form-container {
            width: 340px;
            background: #202024;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #29292e;
        }

        .campo {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            color: #a8a8b3;
        }

        input,
        textarea {
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: #121214;
            color: #fff;
            font-size: 15px;
        }

        button {
            background: #04d361;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
        }

        button:hover {
            background: #06b956;
        }

        .aviso-permiso {
            background: #202024;
            border: 1px solid #29292e;
            border-radius: 8px;
            padding: 20px;
            color: #a8a8b3;
            width: 340px;
            text-align: center;
        }

        .mensaje-error {
            color: #f75a68;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>🏷️ Categorías de Videojuegos</h1>

    <div class="layout">
        <div class="lista-categorias" id="listaCategorias">
            <p>Cargando categorías...</p>
        </div>

        <!-- Este contenedor se llena en JS: formulario si eres admin,
             aviso si no lo eres o no has iniciado sesión -->
        <div id="panelAdmin"></div>
    </div>

    <script src="js/sesion.js"></script>
    <script>
        // Guardamos la última lista cargada para no tener que pasar texto con
        // comillas/acentos dentro de atributos onclick (frágil y propenso a errores)
        let categoriasCache = [];

        async function cargarCategorias() {
            const contenedor = document.getElementById("listaCategorias");
            const sesion = obtenerSesion();
            const esAdmin = sesion && sesion.usuario.rol === "admin";
            try {
                const respuesta = await fetch(`${API_BASE}/categorias`);
                const categorias = await respuesta.json();
                categoriasCache = categorias;

                if (categorias.length === 0) {
                    contenedor.innerHTML = "<p>Todavía no hay categorías registradas.</p>";
                    return;
                }

                contenedor.innerHTML = categorias.map(categoria => `
          <div class="tarjeta-categoria" id="categoria-${categoria._id}">
            <h3>${categoria.nombre}</h3>
            <p>${categoria.descripcion}</p>
            ${esAdmin ? `
            <div class="acciones-categoria">
              <button type="button" onclick="activarEdicionCategoria('${categoria._id}')">✏️ Editar</button>
              <button type="button" class="btn-eliminar" onclick="eliminarCategoria('${categoria._id}')">🗑️ Eliminar</button>
            </div>` : ""}
          </div>
        `).join("");
            } catch (error) {
                contenedor.innerHTML = `<p style="color:#f75a68;">❌ Error al conectar: ${error.message}</p>`;
            }
        }

        // Cambia una tarjeta a modo edición, usando los datos ya cargados en cache
        function activarEdicionCategoria(id) {
            const categoria = categoriasCache.find(c => c._id === id);
            if (!categoria) return;
            const tarjeta = document.getElementById(`categoria-${id}`);
            const nombreInput = document.createElement("input");
            nombreInput.type = "text";
            nombreInput.id = `editNombre-${id}`;
            nombreInput.value = categoria.nombre;

            const descripcionInput = document.createElement("textarea");
            descripcionInput.id = `editDescripcion-${id}`;
            descripcionInput.rows = 2;
            descripcionInput.value = categoria.descripcion;

            tarjeta.innerHTML = "";
            const campoNombre = document.createElement("div");
            campoNombre.className = "campo";
            campoNombre.innerHTML = "<label>Nombre:</label>";
            campoNombre.appendChild(nombreInput);

            const campoDescripcion = document.createElement("div");
            campoDescripcion.className = "campo";
            campoDescripcion.innerHTML = "<label>Descripción:</label>";
            campoDescripcion.appendChild(descripcionInput);

            const acciones = document.createElement("div");
            acciones.className = "acciones-categoria";
            const btnGuardar = document.createElement("button");
            btnGuardar.type = "button";
            btnGuardar.textContent = "💾 Guardar";
            btnGuardar.onclick = () => guardarEdicionCategoria(id);
            const btnCancelar = document.createElement("button");
            btnCancelar.type = "button";
            btnCancelar.style.background = "#29292e";
            btnCancelar.textContent = "Cancelar";
            btnCancelar.onclick = () => cargarCategorias();
            acciones.appendChild(btnGuardar);
            acciones.appendChild(btnCancelar);

            const mensajeError = document.createElement("div");
            mensajeError.id = `mensajeErrorEdit-${id}`;
            mensajeError.className = "mensaje-error";

            tarjeta.appendChild(campoNombre);
            tarjeta.appendChild(campoDescripcion);
            tarjeta.appendChild(acciones);
            tarjeta.appendChild(mensajeError);
        }

        async function guardarEdicionCategoria(id) {
            const nombre = document.getElementById(`editNombre-${id}`).value;
            const descripcion = document.getElementById(`editDescripcion-${id}`).value;
            const mensajeError = document.getElementById(`mensajeErrorEdit-${id}`);
            try {
                const respuesta = await fetch(`${API_BASE}/categorias/${id}`, {
                    method: "PUT",
                    headers: Object.assign({ "Content-Type": "application/json" }, headerAutorizacion()),
                    body: JSON.stringify({ nombre, descripcion })
                });
                const datos = await respuesta.json();
                if (!respuesta.ok) {
                    mensajeError.textContent = "❌ " + (datos.mensaje || "No se pudo actualizar");
                    return;
                }
                cargarCategorias();
            } catch (error) {
                mensajeError.textContent = "❌ Error de red: " + error.message;
            }
        }

        async function eliminarCategoria(id) {
            if (!confirm("⚠️ ¿Seguro que quieres eliminar esta categoría?")) return;
            try {
                const respuesta = await fetch(`${API_BASE}/categorias/${id}`, {
                    method: "DELETE",
                    headers: headerAutorizacion()
                });
                const datos = await respuesta.json().catch(() => ({}));
                if (!respuesta.ok) {
                    alert("❌ " + (datos.mensaje || "No se pudo eliminar"));
                    return;
                }
                cargarCategorias();
            } catch (error) {
                alert("❌ Error de red: " + error.message);
            }
        }

        // Decide qué se muestra a la derecha: el formulario (solo admin) o
        // un aviso (invitado o cliente sin permisos)
        function renderPanelAdmin() {
            const sesion = obtenerSesion();
            const panel = document.getElementById("panelAdmin");

            if (sesion && sesion.usuario.rol === "admin") {
                panel.innerHTML = `
          <div class="form-container">
            <h3>➕ Nueva categoría</h3>
            <form id="formCategoria">
              <div class="campo"><label>Nombre:</label><input type="text" id="nombre" required></div>
              <div class="campo"><label>Descripción:</label><textarea id="descripcion" rows="3" required></textarea></div>
              <button type="submit">Guardar categoría</button>
              <div id="mensajeError" class="mensaje-error"></div>
            </form>
          </div>
        `;

                document.getElementById("formCategoria").addEventListener("submit", async(e) => {
                    e.preventDefault();
                    const mensajeError = document.getElementById("mensajeError");
                    mensajeError.textContent = "";

                    const datosCategoria = {
                        nombre: document.getElementById("nombre").value,
                        descripcion: document.getElementById("descripcion").value
                    };

                    try {
                        const respuesta = await fetch(`${API_BASE}/categorias`, {
                            method: "POST",
                            headers: Object.assign({ "Content-Type": "application/json" }, headerAutorizacion()),
                            body: JSON.stringify(datosCategoria)
                        });
                        const datos = await respuesta.json();

                        if (!respuesta.ok) {
                            mensajeError.textContent = "❌ " + (datos.mensaje || "No se pudo guardar");
                            return;
                        }

                        document.getElementById("formCategoria").reset();
                        cargarCategorias();
                    } catch (error) {
                        mensajeError.textContent = "❌ Error de red: " + error.message;
                    }
                });

            } else if (sesion) {
                panel.innerHTML = `<div class="aviso-permiso">Solo el administrador puede agregar categorías.</div>`;
            } else {
                panel.innerHTML = `<div class="aviso-permiso">Inicia sesión como administrador para agregar categorías.<br><br>
          <a href="login.html" style="color:#8257e5;">Iniciar sesión</a></div>`;
            }
        }

        window.onload = () => {
            renderNav("categorias.html");
            cargarCategorias();
            renderPanelAdmin();
        };
    </script>
</body>

</html>
