<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧾 Órdenes</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #121214;
            color: #fff;
            margin: 40px;
        }
        
        h1 {
            color: #8257e5;
        }
        
        .nav-principal {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #202024;
            padding: 15px 30px;
            margin: -40px -40px 30px -40px;
            border-bottom: 1px solid #29292e;
        }
        
        .nav-link {
            color: #a8a8b3;
            text-decoration: none;
            font-size: 14px;
        }
        
        .nav-link:hover,
        .nav-link.activo {
            color: #fff;
        }
        
        .nav-usuario {
            margin-left: auto;
            color: #04d361;
            font-size: 14px;
        }
        
        .layout {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }
        
        .lista-ordenes {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .tarjeta-orden {
            background: #202024;
            border: 1px solid #29292e;
            border-radius: 8px;
            padding: 18px 20px;
        }
        
        .tarjeta-orden .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .tarjeta-orden .total {
            color: #04d361;
            font-weight: bold;
        }
        
        .tarjeta-orden ul {
            margin: 8px 0;
            padding-left: 20px;
            color: #a8a8b3;
            font-size: 14px;
        }
        
        .etiqueta-estado {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .pendiente {
            background: #f7b73433;
            color: #f7b734;
        }
        
        .completado {
            background: #04d36133;
            color: #04d361;
        }
        
        .cancelado {
            background: #f75a6833;
            color: #f75a68;
        }
        
        .control-admin {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        select,
        input {
            padding: 8px;
            border-radius: 5px;
            border: none;
            background: #121214;
            color: #fff;
            font-size: 14px;
        }
        
        .form-container {
            width: 360px;
            background: #202024;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #29292e;
        }
        
        .campo {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }
        
        label {
            margin-bottom: 5px;
            color: #a8a8b3;
            font-size: 14px;
        }
        
        .fila-item {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .fila-item input {
            flex: 1;
        }
        
        button {
            background: #04d361;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover {
            background: #06b956;
        }
        
        .btn-secundario {
            background: #29292e;
            width: 100%;
            margin-bottom: 15px;
        }
        
        .btn-secundario:hover {
            background: #34343a;
        }
        
        .btn-guardar {
            width: 100%;
        }
        
        .total-form {
            text-align: right;
            font-size: 18px;
            color: #04d361;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .aviso-permiso {
            background: #202024;
            border: 1px solid #29292e;
            border-radius: 8px;
            padding: 20px;
            color: #a8a8b3;
            width: 360px;
            text-align: center;
        }
        
        .mensaje-error {
            color: #f75a68;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .filtros {
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
        }
        
        .filtros select {
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: #202024;
            color: #fff;
            font-size: 15px;
        }
        
        .filtros button {
            width: auto;
            background: #8257e5;
            padding: 10px 16px;
        }
        
        .filtros button:hover {
            background: #9466ff;
        }
        
        .btn-eliminar-orden {
            background: #f75a68;
            width: 100%;
            margin-top: 8px;
        }
        
        .btn-eliminar-orden:hover {
            background: #d94552;
        }
    </style>
</head>

<body>

    <h1>🧾 Órdenes</h1>

    <div class="filtros">
        <select id="selectEstadoOrden">
            <option value="">Todos los estados</option>
            <option value="pendiente">Pendiente</option>
            <option value="completado">Completado</option>
            <option value="cancelado">Cancelado</option>
        </select>
        <button type="button" onclick="cargarOrdenes()">🔍 Filtrar</button>
    </div>

    <div class="layout">
        <div class="lista-ordenes" id="listaOrdenes">
            <p>Cargando órdenes...</p>
        </div>

        <div id="panelLateral"></div>
    </div>

    <script src="js/sesion.js"></script>
    <script>
        // Guardamos aquí en memoria los items que el cliente va agregando
        // a su nueva orden, antes de mandarla al backend.
        let itemsNuevaOrden = [];

        // Cupón validado contra el backend y actualmente aplicado a la
        // orden en construcción (o null si no hay ninguno).
        let cuponActual = null;

        // Catálogo real de videojuegos, cargado desde la API. El select del
        // formulario SOLO puede elegir entre estos — nada de texto libre.
        let catalogoVideojuegos = [];

        async function cargarCatalogoVideojuegos() {
            try {
                // limite=100: para armar una orden necesitamos ver TODO el
                // catálogo disponible, no solo una página
                const respuesta = await fetch(`${API_BASE}/videojuegos?limite=100`);
                const datos = await respuesta.json();
                catalogoVideojuegos = datos.resultados || [];
            } catch (error) {
                catalogoVideojuegos = [];
            }
        }

        async function cargarOrdenes() {
            const contenedor = document.getElementById("listaOrdenes");
            const sesion = obtenerSesion();

            if (!sesion) {
                contenedor.innerHTML = "<p>Inicia sesión para ver tus órdenes.</p>";
                return;
            }

            try {
                const estado = document.getElementById("selectEstadoOrden").value;
                const respuesta = await fetch(`${API_BASE}/ordenes?estado=${estado}`, {
                    headers: headerAutorizacion()
                });
                const ordenes = await respuesta.json();

                if (!respuesta.ok) {
                    contenedor.innerHTML = `<p style="color:#f75a68;">❌ ${ordenes.mensaje || 'Error al cargar órdenes'}</p>`;
                    return;
                }

                if (ordenes.length === 0) {
                    contenedor.innerHTML = "<p>No se encontraron órdenes con ese filtro.</p>";
                    return;
                }

                const esAdmin = sesion.usuario.rol === "admin";

                contenedor.innerHTML = ordenes.map(orden => {
                    const items = orden.items.map(item =>
                        `<li>${item.cantidad}x ${item.titulo} — $${item.precioUnitario} c/u</li>`
                    ).join("");

                    const controlEstado = esAdmin ? `
            <div class="control-admin">
              <select id="estado-${orden._id}">
                <option value="pendiente" ${orden.estado === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                <option value="completado" ${orden.estado === 'completado' ? 'selected' : ''}>Completado</option>
                <option value="cancelado" ${orden.estado === 'cancelado' ? 'selected' : ''}>Cancelado</option>
              </select>
              <button onclick="cambiarEstado('${orden._id}')">Actualizar estado</button>
            </div>
            <button type="button" class="btn-eliminar-orden" onclick="eliminarOrden('${orden._id}')">🗑️ Eliminar orden</button>
          ` : "";

                    const tieneDescuento = orden.cupon && orden.cupon.codigo;
                    const bloqueDescuento = tieneDescuento ? `
            <div style="color:#a8a8b3; font-size:13px;">Subtotal: $${orden.subtotal}</div>
            <div style="color:#04d361; font-size:13px;">🎟️ Cupón "${orden.cupon.codigo}" (-${orden.cupon.porcentajeDescuento}%): -$${orden.descuento}</div>
          ` : "";

                    return `
            <div class="tarjeta-orden">
              <div class="encabezado">
                <strong>${esAdmin ? (orden.usuario.nombre || 'Cliente') : 'Tu orden'}</strong>
                <span class="etiqueta-estado ${orden.estado}">${orden.estado}</span>
              </div>
              <ul>${items}</ul>
              ${bloqueDescuento}
              <div class="total">Total: $${orden.total}</div>
              ${controlEstado}
            </div>
          `;
                }).join("");
            } catch (error) {
                contenedor.innerHTML = `<p style="color:#f75a68;">❌ Error al conectar: ${error.message}</p>`;
            }
        }

        // Solo el admin puede borrar una orden por completo (uso: limpieza).
        // Para el flujo normal, lo correcto es cambiar el estado a "cancelado".
        async function eliminarOrden(ordenId) {
            if (!confirm("⚠️ ¿Seguro que quieres eliminar esta orden por completo? Esta acción no se puede deshacer.")) return;
            try {
                const respuesta = await fetch(`${API_BASE}/ordenes/${ordenId}`, {
                    method: "DELETE",
                    headers: headerAutorizacion()
                });
                const datos = await respuesta.json().catch(() => ({}));
                if (!respuesta.ok) {
                    alert("❌ " + (datos.mensaje || "No se pudo eliminar"));
                    return;
                }
                cargarOrdenes();
            } catch (error) {
                alert("❌ Error de red: " + error.message);
            }
        }

        // Solo el admin usa esto (el botón únicamente aparece para admin)
        async function cambiarEstado(ordenId) {
            const nuevoEstado = document.getElementById(`estado-${ordenId}`).value;
            try {
                const respuesta = await fetch(`${API_BASE}/ordenes/${ordenId}/estado`, {
                    method: "PUT",
                    headers: Object.assign({
                        "Content-Type": "application/json"
                    }, headerAutorizacion()),
                    body: JSON.stringify({
                        estado: nuevoEstado
                    })
                });
                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    alert("❌ " + (datos.mensaje || "No se pudo actualizar"));
                    return;
                }
                cargarOrdenes();
            } catch (error) {
                alert("❌ Error de red: " + error.message);
            }
        }

        function recalcularTotal() {
            const subtotal = itemsNuevaOrden.reduce((suma, item) => suma + (item.cantidad * item.precioUnitario), 0);
            const descuento = cuponActual ? subtotal * (cuponActual.porcentajeDescuento / 100) : 0;
            const total = subtotal - descuento;

            const contenedor = document.getElementById("resumenTotales");
            if (!contenedor) return;

            let html = `<div style="color:#a8a8b3; font-size:14px; text-align:right;">Subtotal: $${subtotal.toFixed(2)}</div>`;
            if (cuponActual) {
                html += `<div style="color:#04d361; font-size:14px; text-align:right;">Cupón "${cuponActual.codigo}" (-${cuponActual.porcentajeDescuento}%): -$${descuento.toFixed(2)}</div>`;
            }
            html += `<div class="total-form">Total: $${total.toFixed(2)}</div>`;
            contenedor.innerHTML = html;
        }

        // Valida el código de cupón contra la API (código, activo y no
        // expirado) y, si es válido, lo deja guardado para mandarlo junto
        // con la orden. El porcentaje real de descuento SIEMPRE lo vuelve
        // a calcular el backend al crear la orden — esto es solo la
        // vista previa para el usuario.
        async function aplicarCupon() {
            const mensajeCupon = document.getElementById("mensajeCupon");
            const codigo = document.getElementById("inputCupon").value.trim();
            mensajeCupon.textContent = "";
            mensajeCupon.style.color = "#f75a68";

            if (!codigo) {
                cuponActual = null;
                recalcularTotal();
                return;
            }

            try {
                const respuesta = await fetch(`${API_BASE}/cupones?buscar=${encodeURIComponent(codigo)}&activo=true`);
                const cupones = await respuesta.json();

                if (!respuesta.ok || !Array.isArray(cupones)) {
                    mensajeCupon.textContent = "❌ No se pudo validar el cupón";
                    cuponActual = null;
                    recalcularTotal();
                    return;
                }

                // Buscamos coincidencia EXACTA de código (buscar= hace match parcial)
                const cupon = cupones.find(c => c.codigo.toLowerCase() === codigo.toLowerCase());

                if (!cupon) {
                    mensajeCupon.textContent = "❌ Cupón inválido o inactivo";
                    cuponActual = null;
                    recalcularTotal();
                    return;
                }

                if (new Date(cupon.fechaExpiracion) < new Date()) {
                    mensajeCupon.textContent = "❌ Ese cupón ya expiró";
                    cuponActual = null;
                    recalcularTotal();
                    return;
                }

                cuponActual = {
                    codigo: cupon.codigo,
                    porcentajeDescuento: cupon.porcentajeDescuento
                };
                mensajeCupon.style.color = "#04d361";
                mensajeCupon.textContent = `✅ Cupón aplicado: -${cupon.porcentajeDescuento}%`;
                recalcularTotal();
            } catch (error) {
                mensajeCupon.textContent = "❌ Error de red al validar el cupón";
                cuponActual = null;
                recalcularTotal();
            }
        }

        function renderListaItemsForm() {
            const contenedor = document.getElementById("listaItemsForm");
            if (!contenedor) return;
            contenedor.innerHTML = itemsNuevaOrden.map((item, indice) =>
                `<div style="display:flex; justify-content:space-between; color:#a8a8b3; font-size:13px; margin-bottom:4px;">
          <span>${item.cantidad}x ${item.titulo} ($${item.precioUnitario} c/u)</span>
          <span style="cursor:pointer; color:#f75a68;" onclick="quitarItem(${indice})">✕</span>
        </div>`
            ).join("");
            recalcularTotal();
        }

        function quitarItem(indice) {
            itemsNuevaOrden.splice(indice, 1);
            renderListaItemsForm();
        }

        function agregarItemAlForm() {
            const selectJuego = document.getElementById("itemVideojuego");
            const videojuegoId = selectJuego.value;
            const cantidad = parseInt(document.getElementById("itemCantidad").value);

            // Buscamos el videojuego elegido dentro del catálogo ya cargado,
            // para sacar SU título y SU precio reales (nunca texto libre).
            const juego = catalogoVideojuegos.find(j => j._id === videojuegoId);

            if (!juego || !cantidad || cantidad < 1) {
                alert("Elige un juego y una cantidad válida antes de agregarlo.");
                return;
            }

            if (cantidad > juego.stock) {
                alert(`Solo hay ${juego.stock} unidades disponibles de "${juego.titulo}".`);
                return;
            }

            itemsNuevaOrden.push({
                videojuegoId: juego._id,
                titulo: juego.titulo,
                cantidad,
                precioUnitario: juego.precio
            });
            document.getElementById("itemCantidad").value = "1";
            renderListaItemsForm();
        }

        async function renderPanelLateral() {
            const sesion = obtenerSesion();
            const panel = document.getElementById("panelLateral");

            if (!sesion) {
                panel.innerHTML = `<div class="aviso-permiso">Inicia sesión para ver o crear órdenes.<br><br>
          <a href="login.html" style="color:#8257e5;">Iniciar sesión</a></div>`;
                return;
            }

            if (sesion.usuario.rol === "admin") {
                panel.innerHTML = `<div class="aviso-permiso">Como administrador puedes cambiar el estado de cada orden directamente en la lista.</div>`;
                return;
            }

            // Solo cliente ve el formulario para armar una orden nueva.
            // Cargamos el catálogo real ANTES de dibujar el select.
            itemsNuevaOrden = [];
            cuponActual = null;
            await cargarCatalogoVideojuegos();

            if (catalogoVideojuegos.length === 0) {
                panel.innerHTML = `<div class="aviso-permiso">Todavía no hay videojuegos en el catálogo para poder ordenar.</div>`;
                return;
            }

            panel.innerHTML = `
        <div class="form-container">
          <h3>➕ Nueva orden</h3>
          <div class="fila-item">
            <select id="itemVideojuego" style="flex:1;">
              ${catalogoVideojuegos.map(juego =>
                `<option value="${juego._id}">${juego.titulo} — $${juego.precio} (stock: ${juego.stock})</option>`
              ).join("")}
            </select>
          </div>
          <div class="fila-item">
            <input type="number" id="itemCantidad" placeholder="Cantidad" min="1" value="1">
          </div>
          <button type="button" class="btn-secundario" onclick="agregarItemAlForm()">+ Agregar item a la orden</button>

          <div id="listaItemsForm"></div>

          <div class="fila-item">
            <input type="text" id="inputCupon" placeholder="Código de cupón (opcional)">
            <button type="button" style="width:auto; background:#8257e5;" onclick="aplicarCupon()">Aplicar</button>
          </div>
          <div id="mensajeCupon" style="font-size:13px; margin-bottom:8px;"></div>

          <div id="resumenTotales"></div>

          <button type="button" class="btn-guardar" onclick="crearOrden()">✅ Confirmar orden</button>
          <div id="mensajeError" class="mensaje-error"></div>
        </div>
      `;
            recalcularTotal();
        }

        async function crearOrden() {
            const mensajeError = document.getElementById("mensajeError");
            mensajeError.textContent = "";

            if (itemsNuevaOrden.length === 0) {
                mensajeError.textContent = "❌ Agrega al menos un item a la orden.";
                return;
            }

            // Solo mandamos videojuegoId y cantidad: el backend consulta el
            // precio real de cada juego y calcula el total él mismo, así que
            // no tiene caso (ni es seguro) mandarle un total ya calculado aquí.
            const itemsParaEnviar = itemsNuevaOrden.map(item => ({
                videojuegoId: item.videojuegoId,
                cantidad: item.cantidad
            }));

            const cuerpo = { items: itemsParaEnviar };
            if (cuponActual) {
                cuerpo.codigoCupon = cuponActual.codigo;
            }

            try {
                const respuesta = await fetch(`${API_BASE}/ordenes`, {
                    method: "POST",
                    headers: Object.assign({ "Content-Type": "application/json" }, headerAutorizacion()),
                    body: JSON.stringify(cuerpo)
                });
                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    mensajeError.textContent = "❌ " + (datos.mensaje || "No se pudo crear la orden");
                    return;
                }

                alert("✅ Orden creada correctamente");
                itemsNuevaOrden = [];
                cuponActual = null;
                renderPanelLateral();
                cargarOrdenes();
            } catch (error) {
                mensajeError.textContent = "❌ Error de red: " + error.message;
            }
        }

        window.onload = () => {
            renderNav("ordenes.html");
            cargarOrdenes();
            renderPanelLateral();
        };
    </script>
</body>

</html>
