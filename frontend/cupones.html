<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎟️ Cupones</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #121214;
            color: #fff;
            margin: 40px;
        }

        h1 {
            color: #8257e5;
        }

        .nav-principal {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #202024;
            padding: 15px 30px;
            margin: -40px -40px 30px -40px;
            border-bottom: 1px solid #29292e;
        }

        .nav-link {
            color: #a8a8b3;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-link:hover,
        .nav-link.activo {
            color: #fff;
        }

        .nav-usuario {
            margin-left: auto;
            color: #04d361;
            font-size: 14px;
        }

        .layout {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .lista-cupones {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tarjeta-cupon {
            background: #202024;
            border: 1px solid #29292e;
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tarjeta-cupon .fila-principal {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tarjeta-cupon .codigo {
            font-size: 18px;
            font-weight: bold;
            color: #04d361;
        }

        .tarjeta-cupon .detalle {
            color: #a8a8b3;
            font-size: 13px;
        }

        .etiqueta-estado {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .activo {
            background: #04d36133;
            color: #04d361;
        }

        .inactivo {
            background: #f75a6833;
            color: #f75a68;
        }

        .form-container {
            width: 340px;
            background: #202024;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #29292e;
        }

        .campo {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            color: #a8a8b3;
        }

        input {
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: #121214;
            color: #fff;
            font-size: 15px;
        }

        .campo-checkbox {
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        button {
            background: #04d361;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
        }

        button:hover {
            background: #06b956;
        }

        .aviso-permiso {
            background: #202024;
            border: 1px solid #29292e;
            border-radius: 8px;
            padding: 20px;
            color: #a8a8b3;
            width: 340px;
            text-align: center;
        }

        .mensaje-error {
            color: #f75a68;
            font-size: 14px;
            margin-top: 10px;
        }

        .filtros {
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
        }

        .filtros input,
        .filtros select {
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: #202024;
            color: #fff;
            font-size: 15px;
        }

        .filtros button {
            width: auto;
            background: #8257e5;
            padding: 10px 16px;
        }

        .filtros button:hover {
            background: #9466ff;
        }

        .acciones-cupon {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .acciones-cupon button {
            width: auto;
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-eliminar {
            background: #f75a68 !important;
        }

        .btn-eliminar:hover {
            background: #d94552 !important;
        }
    </style>
</head>

<body>

    <h1>🎟️ Cupones de Descuento</h1>

    <div class="filtros">
        <input type="text" id="inputBuscarCupon" placeholder="Buscar por código...">
        <select id="selectActivoCupon">
            <option value="">Todos los estados</option>
            <option value="true">Solo activos</option>
            <option value="false">Solo inactivos</option>
        </select>
        <button type="button" onclick="cargarCupones()">🔍 Filtrar</button>
    </div>

    <div class="layout">
        <div class="lista-cupones" id="listaCupones">
            <p>Cargando cupones...</p>
        </div>

        <div id="panelAdmin"></div>
    </div>

    <script src="js/sesion.js"></script>
    <script>
        let cuponesCache = [];

        async function cargarCupones() {
            const contenedor = document.getElementById("listaCupones");
            const sesion = obtenerSesion();
            const esAdmin = sesion && sesion.usuario.rol === "admin";
            const buscar = document.getElementById("inputBuscarCupon").value;
            const activo = document.getElementById("selectActivoCupon").value;

            try {
                const url = `${API_BASE}/cupones?buscar=${encodeURIComponent(buscar)}&activo=${activo}`;
                const respuesta = await fetch(url);
                const cupones = await respuesta.json();
                cuponesCache = cupones;

                if (cupones.length === 0) {
                    contenedor.innerHTML = "<p>No se encontraron cupones.</p>";
                    return;
                }

                contenedor.innerHTML = cupones.map(cupon => {
                    const fecha = new Date(cupon.fechaExpiracion).toLocaleDateString("es-MX");
                    return `
            <div class="tarjeta-cupon" id="cupon-${cupon._id}">
              <div class="fila-principal">
                <div>
                  <div class="codigo">${cupon.codigo}</div>
                  <div class="detalle">${cupon.porcentajeDescuento}% de descuento · vence ${fecha}</div>
                </div>
                <span class="etiqueta-estado ${cupon.activo ? 'activo' : 'inactivo'}">${cupon.activo ? 'Activo' : 'Inactivo'}</span>
              </div>
              ${esAdmin ? `
              <div class="acciones-cupon">
                <button type="button" onclick="activarEdicionCupon('${cupon._id}')">✏️ Editar</button>
                <button type="button" class="btn-eliminar" onclick="eliminarCupon('${cupon._id}')">🗑️ Eliminar</button>
              </div>` : ""}
            </div>
          `;
                }).join("");
            } catch (error) {
                contenedor.innerHTML = `<p style="color:#f75a68;">❌ Error al conectar: ${error.message}</p>`;
            }
        }

        // Convierte una fecha ISO a formato yyyy-mm-dd para el <input type="date">
        function formatoFechaInput(fechaISO) {
            return new Date(fechaISO).toISOString().split("T")[0];
        }

        function activarEdicionCupon(id) {
            const cupon = cuponesCache.find(c => c._id === id);
            if (!cupon) return;
            const tarjeta = document.getElementById(`cupon-${id}`);
            tarjeta.innerHTML = `
        <div class="campo"><label>Código:</label><input type="text" id="editCodigo-${id}" value="${cupon.codigo}"></div>
        <div class="campo"><label>% de descuento:</label><input type="number" id="editPorcentaje-${id}" min="1" max="100" value="${cupon.porcentajeDescuento}"></div>
        <div class="campo"><label>Fecha de expiración:</label><input type="date" id="editFecha-${id}" value="${formatoFechaInput(cupon.fechaExpiracion)}"></div>
        <div class="campo campo-checkbox"><input type="checkbox" id="editActivo-${id}" ${cupon.activo ? "checked" : ""}><label style="margin:0;">Activo</label></div>
        <div class="acciones-cupon">
          <button type="button" onclick="guardarEdicionCupon('${id}')">💾 Guardar</button>
          <button type="button" style="background:#29292e;" onclick="cargarCupones()">Cancelar</button>
        </div>
        <div id="mensajeErrorEdit-${id}" class="mensaje-error"></div>
      `;
        }

        async function guardarEdicionCupon(id) {
            const mensajeError = document.getElementById(`mensajeErrorEdit-${id}`);
            const datosCupon = {
                codigo: document.getElementById(`editCodigo-${id}`).value,
                porcentajeDescuento: parseFloat(document.getElementById(`editPorcentaje-${id}`).value),
                activo: document.getElementById(`editActivo-${id}`).checked,
                fechaExpiracion: document.getElementById(`editFecha-${id}`).value
            };
            try {
                const respuesta = await fetch(`${API_BASE}/cupones/${id}`, {
                    method: "PUT",
                    headers: Object.assign({ "Content-Type": "application/json" }, headerAutorizacion()),
                    body: JSON.stringify(datosCupon)
                });
                const datos = await respuesta.json();
                if (!respuesta.ok) {
                    mensajeError.textContent = "❌ " + (datos.mensaje || "No se pudo actualizar");
                    return;
                }
                cargarCupones();
            } catch (error) {
                mensajeError.textContent = "❌ Error de red: " + error.message;
            }
        }

        async function eliminarCupon(id) {
            if (!confirm("⚠️ ¿Seguro que quieres eliminar este cupón?")) return;
            try {
                const respuesta = await fetch(`${API_BASE}/cupones/${id}`, {
                    method: "DELETE",
                    headers: headerAutorizacion()
                });
                const datos = await respuesta.json().catch(() => ({}));
                if (!respuesta.ok) {
                    alert("❌ " + (datos.mensaje || "No se pudo eliminar"));
                    return;
                }
                cargarCupones();
            } catch (error) {
                alert("❌ Error de red: " + error.message);
            }
        }

        function renderPanelAdmin() {
            const sesion = obtenerSesion();
            const panel = document.getElementById("panelAdmin");

            if (sesion && sesion.usuario.rol === "admin") {
                panel.innerHTML = `
          <div class="form-container">
            <h3>➕ Nuevo cupón</h3>
            <form id="formCupon">
              <div class="campo"><label>Código:</label><input type="text" id="codigo" placeholder="VERANO2026" required></div>
              <div class="campo"><label>% de descuento:</label><input type="number" id="porcentajeDescuento" min="1" max="100" required></div>
              <div class="campo"><label>Fecha de expiración:</label><input type="date" id="fechaExpiracion" required></div>
              <div class="campo campo-checkbox"><input type="checkbox" id="activo" checked><label style="margin:0;">Activo desde ahora</label></div>
              <button type="submit">Guardar cupón</button>
              <div id="mensajeError" class="mensaje-error"></div>
            </form>
          </div>
        `;

                document.getElementById("formCupon").addEventListener("submit", async(e) => {
                    e.preventDefault();
                    const mensajeError = document.getElementById("mensajeError");
                    mensajeError.textContent = "";

                    const datosCupon = {
                        codigo: document.getElementById("codigo").value,
                        porcentajeDescuento: parseFloat(document.getElementById("porcentajeDescuento").value),
                        activo: document.getElementById("activo").checked,
                        fechaExpiracion: document.getElementById("fechaExpiracion").value
                    };

                    try {
                        const respuesta = await fetch(`${API_BASE}/cupones`, {
                            method: "POST",
                            headers: Object.assign({ "Content-Type": "application/json" }, headerAutorizacion()),
                            body: JSON.stringify(datosCupon)
                        });
                        const datos = await respuesta.json();

                        if (!respuesta.ok) {
                            mensajeError.textContent = "❌ " + (datos.mensaje || "No se pudo guardar");
                            return;
                        }

                        document.getElementById("formCupon").reset();
                        cargarCupones();
                    } catch (error) {
                        mensajeError.textContent = "❌ Error de red: " + error.message;
                    }
                });

            } else if (sesion) {
                panel.innerHTML = `<div class="aviso-permiso">Solo el administrador puede agregar cupones.</div>`;
            } else {
                panel.innerHTML = `<div class="aviso-permiso">Inicia sesión como administrador para agregar cupones.<br><br>
          <a href="login.html" style="color:#8257e5;">Iniciar sesión</a></div>`;
            }
        }

        window.onload = () => {
            renderNav("cupones.html");
            cargarCupones();
            renderPanelAdmin();
        };
    </script>
</body>

</html>
